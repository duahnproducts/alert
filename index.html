      <h1>Về Hometown</h1>
      <p class="demo-only note"><b>Đây là bản demo.</b> Các quán (tên tự đặt), đánh giá, giá và cảm nhận về địa danh đều là dữ liệu minh họa, được gắn nhãn “Mẫu”, không phản ánh quán thật nào. Địa danh, vị trí và ảnh địa danh là thật. Khi app chạy thật, chỉ người đã check-in tại quán mới viết được đánh giá.</p>
      <p>Hometown là bản đồ các quán ăn ngon dưới 50k quanh trường, do chính sinh viên chấm điểm. Quán ngon vì người ăn thật nói ngon, không phải vì được quảng cáo.</p>

      <h2>Cách tính điểm</h2>
      <ul>
        <li><b>Điểm Hometown</b> là trung bình số sao của các đánh giá đang hiện. Quán có dưới 3 đánh giá thì hiện chữ “Mới” thay cho điểm.</li>
        <li>App không lấy hay gộp điểm của Google. Muốn xem thêm đánh giá trên Google, bấm link “Xem đánh giá trên Google Maps” ở trang quán.</li>
        <li>Đánh giá có nhãn “Mẫu” chỉ để minh họa, không được tính vào điểm hay giá.</li>
      </ul>

      <h2>Giá thật</h2>
      <p>Mỗi người viết đánh giá báo lại số tiền đã trả. “Thường 35k” là giá ở giữa (trung vị) của tất cả các lần báo, nên một giá bất thường không kéo lệch được. Khoảng “từ… đến…” là nơi một nửa số người đã trả. Quán có dưới 3 lượt báo giá thì hiện khoảng giá nhóm ghi lúc đi khảo sát, kèm chữ “giá tham khảo”.</p>

      <h2>Vì sao phải check-in</h2>
      <p>Bạn chỉ viết được đánh giá khi đang ở trong vòng 150 m quanh quán. Đây là xác thực cơ bản: vị trí gửi từ trình duyệt vẫn có thể bị làm giả, nhưng đủ để chặn người ngồi nhà viết bừa. App không lưu vị trí của bạn, chỉ lưu khoảng cách tới quán.</p>

      <h2>Giữ nội dung sạch</h2>
      <ul>
        <li>Mỗi người đánh giá mỗi quán một lần mỗi ngày, tối đa 10 đánh giá mỗi ngày.</li>
        <li>Nhận xét không được có link hay số điện thoại, để không ai dùng app quảng cáo.</li>
        <li>Ảnh của tài khoản mới chờ nhóm duyệt trước khi hiện.</li>
        <li>Nội dung bị 3 người khác nhau báo cáo sẽ tự ẩn. Nhóm duyệt lúc 12:00 và 21:00 mỗi ngày.</li>
        <li>Huy hiệu cạnh tên: <b>Mới đến</b> (1–4 đánh giá), <b>Hàng xóm</b> (5–14), <b>Thổ địa</b> (từ 15).</li>
      </ul>

      <h2>Cam kết</h2>
      <p>Hometown không nhận tiền từ quán, không có quảng cáo, không có chỗ trả tiền để lên đầu. Đánh giá chỉ nói về trải nghiệm ăn uống, không thay cơ quan chức năng đánh giá vệ sinh an toàn thực phẩm. Chủ quán thấy đánh giá sai sự thật có thể bấm “Báo cáo” hoặc liên hệ nhóm, nhóm trả lời trong 24 giờ.</p>

      <h2>Nguồn dữ liệu</h2>
      <ul>
        <li>Tên, vị trí, giờ mở cửa của quán: nhóm tự đi khảo sát và bạn đọc đề xuất.</li>
        <li>Bản đồ: dữ liệu © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> qua <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> và OpenMapTiles, nhóm tự vẽ lại kiểu chibi bằng <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a> và protomaps-leaflet. Chỉ đường: <a href="https://github.com/valhalla/valhalla" target="_blank" rel="noopener">Valhalla</a> trên máy chủ miễn phí của <a href="https://www.fossgis.de" target="_blank" rel="noopener">FOSSGIS</a>, dữ liệu OpenStreetMap; luôn có nút mở bằng Google Maps.</li>
        <li>Địa danh nổi tiếng: vị trí từ <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, giới thiệu từ Wikipedia tiếng Việt (CC BY-SA 4.0), ảnh thật từ <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>; tên tác giả và giấy phép ghi ngay dưới mỗi ảnh.</li>
        <li>Biểu tượng món ăn, địa danh và linh vật Bao: nhóm tự vẽ.</li>
        <li>Font chữ: Be Vietnam Pro, giấy phép SIL Open Font License.</li>
      </ul>

      <details>
        <summary>Chất lượng theo ISO/IEC 25010:2023</summary>
        <ul>
          <li><b>Phù hợp chức năng:</b> đủ vòng tìm quán, xem, đi, đánh giá; giá thật là trung vị.</li>
          <li><b>Hiệu năng:</b> ảnh nén sẵn 2 cỡ, chỉ tải khi cuộn tới; bản đồ nạp sau danh sách.</li>
          <li><b>Tương thích:</b> chạy trên Chrome Android, Safari iOS, trình duyệt trong Facebook và Zalo.</li>
          <li><b>Khả năng tương tác:</b> xem không cần đăng nhập, có chế độ danh sách, chữ tương phản tối thiểu 4,5:1.</li>
          <li><b>Tin cậy:</b> bản đồ lỗi thì chuyển sang danh sách; mất mạng thì hiện dữ liệu đã lưu kèm giờ lưu.</li>
          <li><b>Bảo mật:</b> phân quyền theo dòng (Row Level Security) trên mọi bảng; mọi quy tắc nằm trong database.</li>
          <li><b>Bảo trì:</b> khoảng 6 file JS, toàn bộ cấu trúc database trong một file.</li>
          <li><b>Linh hoạt:</b> thêm thành phố hoặc cụm trường chỉ cần thêm dữ liệu, không sửa code.</li>
          <li><b>An toàn:</b> không lưu vị trí người dùng, xóa thông tin vị trí trong ảnh, tự ẩn nội dung bị báo cáo.</li>
        </ul>
      </details>

      <h2 id="rieng-tu">Chính sách quyền riêng tư</h2>
      <p>App chỉ thu những gì cần để hiện một đánh giá, và bạn xóa được tất cả bằng một nút.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Thu gì</th><th>Để làm gì</th><th>Ai thấy</th></tr></thead>
          <tbody>
            <tr><td>Email</td><td>Đăng nhập</td><td>Chỉ bạn và hệ thống đăng nhập</td></tr>
            <tr><td>Tên hiển thị</td><td>Hiện cạnh đánh giá</td><td>Mọi người</td></tr>
            <tr><td>Đánh giá và ảnh</td><td>Nội dung của app</td><td>Mọi người</td></tr>
            <tr><td>Khoảng cách lúc check-in</td><td>Xác nhận bạn đã ở quán</td><td>Chỉ nhóm</td></tr>
          </tbody>
        </table>
      </div>
      <p><b>Vị trí:</b> khi bạn cho phép, app dùng vị trí để gợi ý quán gần bạn và tính khoảng cách. Việc này làm ngay trên máy bạn: vị trí không gửi đi, không lưu lại, đóng trang là mất. Riêng lúc check-in để viết đánh giá, vị trí được gửi một lần để kiểm tra bạn có đang ở quán không, và chỉ khoảng cách tới quán được lưu. Khi bạn mở trang “Chỉ đường”, vị trí của bạn và của quán được gửi tới máy chủ tìm đường của FOSSGIS (Đức) để vẽ đường; app không lưu, FOSSGIS ghi yêu cầu vào nhật ký máy chủ theo chính sách riêng tư của họ.</p>
      <p><b>Không thu:</b> tọa độ của bạn, lịch sử duyệt web, danh bạ. App không dùng công cụ phân tích hay quảng cáo của bên thứ ba.</p>
      <p><b>Ảnh:</b> trước khi tải lên, app vẽ lại ảnh ngay trên máy bạn nên mọi thông tin đi kèm ảnh (gồm vị trí GPS chụp ảnh) bị xóa. Ảnh chỉ dùng để hiện trong trang quán. Bạn xóa ảnh bằng cách xóa đánh giá chứa nó trong mục “Của tôi”.</p>
      <p><b>Lưu ở đâu:</b> dữ liệu nằm trên Supabase (cơ sở dữ liệu và kho ảnh). Trình duyệt của bạn lưu tạm danh sách quán để xem được khi mất mạng, và lưu phiên đăng nhập. Bản đồ tải từ OpenFreeMap, ảnh địa danh tải từ Wikimedia; app không gửi thông tin gì của bạn cho hai nơi này.</p>
      <p><b>Đồng ý và rút lại:</b> khi đăng nhập, bạn đồng ý cho app xử lý các dữ liệu trên. Bạn rút lại sự đồng ý bất cứ lúc nào bằng nút “Xóa tài khoản” trong mục “Của tôi”: mọi đánh giá, ảnh và email của bạn bị xóa vĩnh viễn.</p>
      <p><b>Căn cứ pháp lý:</b> Luật Bảo vệ dữ liệu cá nhân 2025 và Nghị định 356/2025/NĐ-CP.</p>
